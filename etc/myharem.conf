### base directory where myharem will work, if not present, it will be created (is user has privileges) ###
basedir=/var/opt/myharem
# default db user
dbuser=mysql

### MariaDB Enterprise downloads (`mh download --edition ES`) ###
# Customer token for dlm.mariadb.com, from
# https://customers.mariadb.com/downloads/token/ . SECURITY: install.sh installs this file
# world-readable (644), and the token is a path segment of the download URL —
# i.e. the URL is itself a secret. Prefer the MYHAREM_ES_TOKEN environment
# variable, or `chmod 600` this file.
# es_token=
# Enterprise ships one tarball per distribution; the default is detected from
# /etc/os-release. Override only if the detection is wrong.
# es_bintar_target=rhel-9-x86_64
